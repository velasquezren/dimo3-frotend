# Ingress del frontend usando AWS Load Balancer Controller.
#
# Crea un Application Load Balancer (ALB) en AWS que enruta tráfico HTTP
# desde internet hacia el Service "frontend" del clúster EKS.
#
# REQUISITOS:
#   - AWS Load Balancer Controller instalado en el clúster.
#   - Subnet tags correctos en la VPC (kubernetes.io/role/elb = 1).
#     El módulo network de dimo3-infra ya los configura automáticamente.
#
# Annotations clave:
#   - scheme: internet-facing   → ALB accesible públicamente desde internet.
#   - target-type: ip           → El ALB enruta tráfico directo a las IPs de los Pods.
#   - listen-ports: 80          → Escucha HTTP en puerto 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: dimo3
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: dimo3
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
