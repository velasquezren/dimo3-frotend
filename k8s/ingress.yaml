# Ingress del frontend usando AWS Load Balancer Controller.
#
# Crea un Application Load Balancer (ALB) en AWS que enruta tráfico HTTP/HTTPS
# desde internet hacia el Service "frontend" del cluster.
#
# REQUISITOS:
#   - AWS Load Balancer Controller instalado en el cluster (Helm o manifiestos).
#     Sin este controller, el Ingress se crea pero NUNCA provisiona el ALB
#     (queda en estado pendiente forever).
#   - Subnet tags correctos en la VPC (kubernetes.io/role/elb = 1 en subnets
#     públicas). El módulo network de dimo3-infra ya los configura.
#
# Annotations clave:
#   - scheme: internet-facing   → ALB accesible desde internet (público).
#   - target-type: ip           → el ALB enruta directamente a los Pods (no a nodos).
#   - listen-ports: 80          → escucha HTTP en puerto 80.
#                                 (HTTPS requeriría cert-manager + ACM, fuera de scope).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: dimo3
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: dimo3
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
