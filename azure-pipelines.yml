# ============================================================
# Pipeline CI/CD para Next.js (Standalone) → Azure App Service
# Web App: "Dimo3" — Node 22 LTS — Linux
# ============================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main
      - develop

variables:
  azureSubscription: 'Dimo-Azure-ServiceConnection'
  webAppName: 'Dimo3'
  npm_config_cache: $(Pipeline.Workspace)/.npm

# ============================================================
# STAGE 1: BUILD (CI)
# ============================================================
stages:
  - stage: Build
    displayName: '🔨 Build & Package'
    jobs:
      - job: BuildJob
        displayName: 'Node.js Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Cache@2
            displayName: '📦 Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)

          - task: NodeTool@0
            displayName: '⬢ Node.js 22.x'
            inputs:
              versionSpec: '22.x'

          - script: npm ci --prefer-offline --no-audit
            displayName: '📥 npm ci'

          - script: npm run lint
            displayName: '🔍 ESLint'

          - script: npm run build
            displayName: '🏗️ Next.js Build'
            env:
              BACKEND_URL: $(BACKEND_URL)

          # Preparar standalone (resolver symlinks)
          - script: |
              set -euo pipefail

              DEPLOY_DIR="$(System.DefaultWorkingDirectory)/standalone_deploy"
              STANDALONE_DIR="$(System.DefaultWorkingDirectory)/.next/standalone"

              if [ ! -d "$STANDALONE_DIR" ]; then
                echo "##vso[task.logissue type=error]No se encontró .next/standalone"
                exit 1
              fi

              mkdir -p "$DEPLOY_DIR"
              cp -rL "$STANDALONE_DIR/." "$DEPLOY_DIR/"
              cp -rL "$(System.DefaultWorkingDirectory)/public" "$DEPLOY_DIR/public"
              cp -rL "$(System.DefaultWorkingDirectory)/.next/static" "$DEPLOY_DIR/.next/static"

              # FIX: Cambiar el script "start" de package.json para que
              # Oryx ejecute "node server.js" en vez de "next start"
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('$DEPLOY_DIR/package.json', 'utf8'));
                pkg.scripts = { start: 'node server.js' };
                fs.writeFileSync('$DEPLOY_DIR/package.json', JSON.stringify(pkg, null, 2));
                console.log('✅ package.json actualizado: start → node server.js');
              "

              # Eliminar manifiestos de Oryx para evitar interferencias
              rm -f "$DEPLOY_DIR/oryx-manifest.toml" 2>/dev/null || true
              rm -f "$DEPLOY_DIR/node_modules.tar.gz" 2>/dev/null || true

              echo "=== Contenido de standalone_deploy ==="
              ls -la "$DEPLOY_DIR"
              echo ""
              echo "=== package.json final ==="
              cat "$DEPLOY_DIR/package.json"
              echo ""
              echo "=== Tamaño total ==="
              du -sh "$DEPLOY_DIR"
            displayName: '📁 Preparar Standalone'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          - task: ArchiveFiles@2
            displayName: '🗜️ Crear ZIP'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/standalone_deploy'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend-drop.zip'
              replaceExistingArchive: true

          - script: |
              echo "=== Tamaño del ZIP ==="
              ls -lh "$(Build.ArtifactStagingDirectory)/frontend-drop.zip"
              echo ""
              echo "=== Verificar server.js en raíz del ZIP ==="
              zipinfo -1 "$(Build.ArtifactStagingDirectory)/frontend-drop.zip" | grep -E "^server\.js$" \
                && echo "✅ server.js en raíz" \
                || echo "❌ server.js NO está en la raíz"
            displayName: '🔎 Verificar ZIP'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          - task: PublishBuildArtifacts@1
            displayName: '📤 Publicar Artefacto'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/frontend-drop.zip'
              ArtifactName: 'drop'
              publishLocation: 'Container'

# ============================================================
# STAGE 2: DEPLOY (CD)
# ============================================================
  - stage: Deploy
    displayName: '🚀 Deploy a App Service'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy a Dimo3'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'dimo-frontend-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: '🚀 Deploy ZIP'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/frontend-drop.zip'

                # Health check
                - script: |
                    echo "Esperando 30s para que la app arranque..."
                    sleep 30

                    APP_URL="https://dimo3-h6f9adhqgrcbeehh.eastus-01.azurewebsites.net"
                    echo "Verificando $APP_URL ..."
                    HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" --max-time 30 || echo "000")

                    if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
                      echo "✅ App respondiendo con HTTP $HTTP_STATUS"
                    else
                      echo "⚠️ HTTP $HTTP_STATUS — revisa los logs en Azure Portal"
                    fi
                  displayName: '🏥 Health Check'
