# =============================================================================
# CI/CD del frontend dimo3-frontend:
#   CodeScan -> BuildPush -> ImageScan -> Deploy
# Trigger: solo pushes a main (producción)
#
# Puertas de seguridad (gates duros, bloquean el deploy si fallan):
#   - CodeScan : ESLint (errores) + npm audit (CRITICAL) + Gitleaks (secrets)
#   - ImageScan: Trivy image scan (HIGH/CRITICAL CVEs) + SBOM CycloneDX
#
# Requisitos previos:
#   - Extensión "AWS Toolkit for Azure DevOps" instalada (provee AWSShellScript@1)
#   - Service Connection AWS "aws-conection" configurada en Azure DevOps
#   - Variable group "Frontend-Secrets" con la variable BACKEND_URL
#   - Infraestructura AWS ya creada: repo ECR, cluster ECS, service, roles IAM,
#     log group de CloudWatch. Ver README.md.
#
# Nota: la extensión AWS Toolkit NO incluye tasks para ECS, por eso el deploy
#       se hace con AWS CLI vía AWSShellScript@1 (que inyecta las creds de la
#       service connection automáticamente, sin exponer secretos).
# =============================================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  # Variable group con BACKEND_URL (Pipelines -> Library -> Frontend-Secrets).
  # Se inyecta como --build-arg en build time y queda "horneada" en la imagen.
  - group: Frontend-Secrets

  # Service Connection AWS (configurada en Azure DevOps -> Project settings -> Service connections)
  - name: awsConnection
    value: 'aws-conection'

  # === Ajustar estos valores (o sobreescribirlos desde Azure Pipelines -> Variables) ===
  - name: awsRegion
    value: 'us-east-1'                    # Región AWS
  - name: ecrRepository
    value: 'dimo-frontend'                # Nombre del repositorio ECR
  - name: ecsCluster
    value: 'dimo-prod-cluster'            # Nombre del cluster ECS
  - name: ecsService
    value: 'dimo-frontend-svc'            # Nombre del service ECS
  - name: ecsTaskFamily
    value: 'dimo-frontend-task'           # Family del task definition
  - name: containerName
    value: 'dimo-frontend'                # Debe coincidir con aws/task-definition.json
  - name: logGroup
    value: '/ecs/dimo-frontend'           # Log group de CloudWatch
  # Rol IAM de ejecución (se reemplaza en el placeholder del task def en runtime)
  - name: executionRoleArn
    value: 'arn:aws:iam::324486142059:role/ecsTaskExecutionRole'

stages:
  # ---------------------------------------------------------------------------
  # Stage 0: CodeScan (puerta de calidad pre-build)
  #   - ESLint: falla solo si hay ERRORES (no warnings)
  #   - npm audit: falla solo en CRITICAL (las HIGH de next/postcss/sharp se reportan)
  #   - Gitleaks: escanea TODO el historial git en busca de secretos
  # Si cualquiera falla, el pipeline se detiene (no se construye ni deploya).
  # ---------------------------------------------------------------------------
  - stage: CodeScan
    displayName: '🔍 Code Scan (lint + audit + secrets)'
    jobs:
      - job: CodeQuality
        displayName: 'ESLint + npm audit + Gitleaks'
        steps:
          - checkout: self
            fetchDepth: 0   # Gitleaks necesita el historial completo

          # 0. Instalar Node toolchain (el agente usa Docker por defecto)
          - task: NodeTool@0
            displayName: 'Instalar Node.js 20.x'
            inputs:
              versionSpec: '20.x'

          # 1. Instalar dependencias
          - bash: |
              set -euo pipefail
              npm ci
            displayName: 'npm ci'

          # 2. ESLint: gatea por ERRORES (exit code != 0). Los warnings no frenan.
          #    npm run lint -> exit 0 con warnings, exit 1/2 con errores.
          - bash: |
              set -euo pipefail
              echo ">>> Ejecutando ESLint..."
              npm run lint
              echo "✅ ESLint sin errores (warnings permitidos)"
            displayName: 'ESLint (errores bloquean)'

          # 3. npm audit: gatea en CRITICAL. Reporta HIGH pero no bloquea,
          #    porque next/postcss/sharp tienen vulns HIGH transitivas sin fix in-range.
          - bash: |
              set +e
              echo ">>> Ejecutando npm audit (nivel CRITICAL)..."
              npm audit --audit-level=critical
              AUDIT_EXIT=$?
              if [ $AUDIT_EXIT -ne 0 ]; then
                echo "❌ npm audit detectó vulnerabilidades CRITICAL. Revisar logs arriba."
                exit $AUDIT_EXIT
              fi
              echo "✅ npm audit sin CRITICAL (revisar HIGH en log arriba si las hubiera)"
            displayName: 'npm audit (CRITICAL bloquea, HIGH reporta)'
            continueOnError: false

          # 4. Gitleaks: escanea todo el repo (historial incluido) en busca de secretos.
          #    Preinstalado en ubuntu-latest; fallback a descarga del release si no lo está.
          - bash: |
              set -euo pipefail
              if ! command -v gitleaks >/dev/null 2>&1; then
                echo "Gitleaks no preinstalado, descargando..."
                VERSION=8.21.2
                curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
                tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
              fi
              echo ">>> Gitleaks $(gitleaks version)"
              gitleaks detect --source . --verbose --redact
              echo "✅ Gitleaks no detectó secretos"
            displayName: 'Gitleaks (secret scan sobre historial git)'

  # ---------------------------------------------------------------------------
  # Stage 1: Construir la imagen y subirla a ECR
  # ---------------------------------------------------------------------------
  - stage: BuildPush
    displayName: 'Build y push a ECR'
    dependsOn: CodeScan
    jobs:
      - job: BuildAndPush
        displayName: 'Build y push'
        steps:
          - checkout: self
            fetchDepth: 0

          # 1. Leer semver de package.json y calcular los tags de la imagen
          - bash: |
              set -euo pipefail
              VERSION=$(jq -r '.version' package.json)
              SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
              IMAGE_TAG="${VERSION}-$(Build.BuildId)"
              echo "Version package.json : ${VERSION}"
              echo "BuildId              : $(Build.BuildId)"
              echo "Commit SHA corto     : ${SHA}"
              echo "Tag principal        : ${IMAGE_TAG}"
              echo "##vso[task.setvariable variable=semver]${VERSION}"
              echo "##vso[task.setvariable variable=imageTag]${IMAGE_TAG}"
              echo "##vso[task.setvariable variable=shaShort]${SHA}"
            displayName: 'Calcular tags de imagen (semver + BuildId + SHA)'

          # 2. Login a ECR + obtener account ID (AWSShellScript usa la service connection)
          - task: AWSShellScript@1
            displayName: 'Login a ECR'
            inputs:
              awsCredentials: '$(awsConnection)'
              regionName: '$(awsRegion)'
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                echo "AWS Account ID: ${ACCOUNT_ID}"
                REGISTRY="${ACCOUNT_ID}.dkr.ecr.$(awsRegion).amazonaws.com"
                ECR_URI="${REGISTRY}/$(ecrRepository)"
                # docker login recibe el host del registro (sin el nombre del repo)
                aws ecr get-login-password --region $(awsRegion) \
                  | docker login --username AWS --password-stdin "${REGISTRY}"
                # Exponer URI completa (con repo) a los pasos siguientes
                echo "##vso[task.setvariable variable=awsAccountId]${ACCOUNT_ID}"
                echo "##vso[task.setvariable variable=ecrUri]${ECR_URI}"

          # 3. Build con los 4 tags (build-arg BACKEND_URL desde el variable group)
          - bash: |
              set -euo pipefail
              URI="$(ecrUri)"
              echo "Construyendo imagen -> ${URI}:$(imageTag)"
              docker build \
                --build-arg BACKEND_URL="$(BACKEND_URL)" \
                -t "${URI}:$(imageTag)" \
                -t "${URI}:$(semver)" \
                -t "${URI}:$(shaShort)" \
                -t "${URI}:latest" \
                .
              # URI completa del tag principal, para el stage de Deploy
              echo "${URI}:$(imageTag)" > deployimage.txt
              echo "Imagen a desplegar: ${URI}:$(imageTag)"
            displayName: 'docker build'

          # 4. Push de los 4 tags (login persiste en el config de Docker del agente)
          - bash: |
              set -euo pipefail
              URI="$(ecrUri)"
              for tag in "$(imageTag)" "$(semver)" "$(shaShort)" "latest"; do
                echo ">>> Push: ${URI}:${tag}"
                docker push "${URI}:${tag}"
              done
            displayName: 'docker push a ECR'

          # 5. Publicar artifact con la URI para el stage Deploy
          - publish: deployimage.txt
            artifact: imageinfo
            displayName: 'Publicar artifact imageinfo'

  # ---------------------------------------------------------------------------
  # Stage 2: ImageScan (puerta de seguridad post-build, pre-deploy)
  #   - Trivy image scan: falla si hay CVEs HIGH o CRITICAL en la imagen Docker
  #   - SBOM CycloneDX: siempre se genera y publica como artifact
  # Si Trivy detecta HIGH/CRITICAL, el deploy NO se ejecuta.
  # ---------------------------------------------------------------------------
  - stage: ImageScan
    displayName: '🛡️ Image Scan (Trivy + SBOM)'
    dependsOn: BuildPush
    jobs:
      - job: ScanImage
        displayName: 'Trivy scan + SBOM CycloneDX'
        steps:
          - download: current
            artifact: imageinfo
            displayName: 'Descargar artifact imageinfo'

          # 1. Recuperar la URI de la imagen a escanear
          - bash: |
              set -euo pipefail
              SCAN_IMAGE=$(cat $(Pipeline.Workspace)/imageinfo/deployimage.txt)
              echo "Imagen a escanear: ${SCAN_IMAGE}"
              echo "##vso[task.setvariable variable=scanImage]${SCAN_IMAGE}"
            displayName: 'Leer URI de imagen del artifact'

          # 2. Login a ECR y docker pull (AWSShellScript usa la service connection)
          - task: AWSShellScript@1
            displayName: 'Login ECR y pull de imagen'
            inputs:
              awsCredentials: '$(awsConnection)'
              regionName: '$(awsRegion)'
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                REGISTRY="${ACCOUNT_ID}.dkr.ecr.$(awsRegion).amazonaws.com"
                aws ecr get-login-password --region $(awsRegion) \
                  | docker login --username AWS --password-stdin "${REGISTRY}"
                docker pull "$(scanImage)"
                echo "✅ Imagen descargada localmente para escaneo"

          # 3. Trivy image scan: falla (exit 1) si hay HIGH o CRITICAL.
          #    Preinstalado en ubuntu-latest; fallback a instalación si no lo está.
          - bash: |
              set -euo pipefail
              if ! command -v trivy >/dev/null 2>&1; then
                echo "Trivy no preinstalado, instalando..."
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                  | sh -s -- -b /usr/local/bin
              fi
              echo ">>> Trivy $(trivy --version)"
              echo ">>> Escaneando imagen: $(scanImage)"
              trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --ignore-unfixed \
                $(scanImage)
              echo "✅ Trivy no detectó vulnerabilidades HIGH/CRITICAL con fix disponible"
            displayName: 'Trivy image scan (HIGH/CRITICAL bloquean)'

          # 4. SBOM CycloneDX de la imagen (siempre se genera, nunca bloquea)
          - bash: |
              set -euo pipefail
              echo ">>> Generando SBOM CycloneDX de: $(scanImage)"
              trivy image \
                --format cyclonedx \
                --output $(Build.ArtifactStagingDirectory)/sbom.cdx.json \
                --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
                $(scanImage)
              echo "✅ SBOM generado: sbom.cdx.json"
              ls -lh $(Build.ArtifactStagingDirectory)/sbom.cdx.json
            displayName: 'Generar SBOM CycloneDX'
            continueOnError: true

          # 5. Publicar SBOM como artifact descargable
          - publish: $(Build.ArtifactStagingDirectory)/sbom.cdx.json
            artifact: sbom-cyclonedx
            displayName: 'Publicar artifact sbom-cyclonedx'
            condition: always()

  # ---------------------------------------------------------------------------
  # Stage 3: Deploy a ECS (rolling: registra nueva revision + service update)
  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: 'Deploy a ECS (rolling)'
    dependsOn: ImageScan
    jobs:
      - job: DeployECS
        displayName: 'Deploy ECS'
        steps:
          - download: current
            artifact: imageinfo
            displayName: 'Descargar artifact imageinfo'

          # 1. Recuperar la URI de la imagen a desplegar como variable del job
          - bash: |
              set -euo pipefail
              DEPLOY_IMAGE=$(cat $(Pipeline.Workspace)/imageinfo/deployimage.txt)
              echo "Imagen a desplegar: ${DEPLOY_IMAGE}"
              echo "##vso[task.setvariable variable=deployImage]${DEPLOY_IMAGE}"
            displayName: 'Leer URI de imagen del artifact'

          # 2. Renderizar task def (reemplazar imagen + placeholders) y registrar
          - task: AWSShellScript@1
            displayName: 'Registrar task definition y actualizar service'
            inputs:
              awsCredentials: '$(awsConnection)'
              regionName: '$(awsRegion)'
              scriptType: 'inline'
              inlineScript: |
                set -euo pipefail

                RENDERED="$(System.DefaultWorkingDirectory)/aws/rendered-task-definition.json"
                cp aws/task-definition.json "$RENDERED"

                # Eliminar campos que ECS no acepta (documentación del JSON)
                jq 'del(._comment)' "$RENDERED" > "$RENDERED.tmp" && mv "$RENDERED.tmp" "$RENDERED"

                # Reemplazar imagen del contenedor (placeholder del repo)
                sed -i "s|placeholder_reemplazado_por_el_pipeline|$(deployImage)|g" "$RENDERED"

                # Reemplazar placeholders de configuración
                sed -i "s|<<AJUSTAR_arn_rol_de_ejecucion>>|$(executionRoleArn)|g" "$RENDERED"
                sed -i "s|<<AJUSTAR_arn_rol_de_tarea>>|$(executionRoleArn)|g" "$RENDERED"
                sed -i "s|<<AJUSTAR_nombre_log_group>>|$(logGroup)|g" "$RENDERED"

                echo "=== Task definition renderizado ==="
                cat "$RENDERED"

                # Registrar la nueva revision del task definition
                NEW_TASK_ARN=$(aws ecs register-task-definition \
                  --cli-input-json "file://${RENDERED}" \
                  --query 'taskDefinition.taskDefinitionArn' --output text)
                echo "Nueva revision registrada: ${NEW_TASK_ARN}"

                # Actualizar el service para que use la nueva revision (deploy rolling)
                aws ecs update-service \
                  --cluster "$(ecsCluster)" \
                  --service "$(ecsService)" \
                  --task-definition "$NEW_TASK_ARN" \
                  --query 'service.{service:serviceName, status:status, desiredCount:desiredCount, taskDef:taskDefinition}' \
                  --output table

                echo ""
                echo ">>> Deploy rolling iniciado. Seguilo con:"
                echo "    aws ecs describe-services --cluster $(ecsCluster) --services $(ecsService)"
