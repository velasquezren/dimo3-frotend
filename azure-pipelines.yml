# =============================================================================
# CI/CD del frontend dimo3-frontend (Azure Cloud Native):
#   CodeScan -> BuildPush -> ImageScan -> DeployToAKS
# Trigger: solo pushes a main (producción)
#
# Puertas de seguridad (gates duros, bloquean el pipeline si fallan):
#   - CodeScan    : ESLint (errores) + npm audit (CRITICAL) + Gitleaks (secrets)
#   - ImageScan   : Trivy image scan (HIGH/CRITICAL CVEs) + SBOM CycloneDX
#   - DeployToAKS : Despliegue automatizado en Azure Kubernetes Service (AKS)
# =============================================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: Frontend-Terraform

  - name: acrRegistry
    value: 'dimo3canacr.azurecr.io'
  - name: acrUser
    value: 'dimo3canacr'
  - name: acrPassword
    value: 'FD6BX7A4ckAW95LXd9LwQcnUBdF3wv2L4lxKd1Ir28GgH24DBWgQJQQJ99CHACBsN54Eqg7NAAACAZCR9ReJ' #gitleaks:allow
  - name: imageName
    value: 'dimo-frontend'

stages:
  # ---------------------------------------------------------------------------
  # Stage 0: CodeScan (puerta de calidad pre-build)
  # ---------------------------------------------------------------------------
  - stage: CodeScan
    displayName: 'Code Scan (lint + audit + secrets)'
    jobs:
      - job: CodeQuality
        displayName: 'ESLint + npm audit + Gitleaks'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            displayName: 'Instalar Node.js 20.x'
            inputs:
              versionSpec: '20.x'

          - bash: |
              set -euo pipefail
              npm ci
            displayName: 'npm ci'

          - bash: |
              set -euo pipefail
              echo ">>> Ejecutando ESLint..."
              npm run lint
              echo "✅ ESLint sin errores"
            displayName: 'ESLint (errores bloquean)'

          - bash: |
              set +e
              echo ">>> Ejecutando npm audit (nivel CRITICAL)..."
              npm audit --audit-level=critical
              AUDIT_EXIT=$?
              if [ $AUDIT_EXIT -ne 0 ]; then
                echo "❌ npm audit detectó vulnerabilidades CRITICAL."
                exit $AUDIT_EXIT
              fi
              echo "✅ npm audit sin CRITICAL"
            displayName: 'npm audit (CRITICAL bloquea)'

          - bash: |
              set -euo pipefail
              if ! command -v gitleaks >/dev/null 2>&1; then
                VERSION=8.21.2
                curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
                tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
              fi
              echo ">>> Gitleaks $(gitleaks version)"
              gitleaks detect --source . --verbose --redact
              echo "✅ Gitleaks no detectó secretos"
            displayName: 'Gitleaks (secret scan sobre historial git)'

  # ---------------------------------------------------------------------------
  # Stage 1: Build & Push a Azure Container Registry (ACR)
  # ---------------------------------------------------------------------------
  - stage: BuildPush
    displayName: 'Build y push a Azure ACR'
    dependsOn: CodeScan
    jobs:
      - job: BuildAndPush
        displayName: 'Build y push a ACR'
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: |
              set -euo pipefail
              VERSION=$(jq -r '.version' package.json)
              SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
              IMAGE_TAG="${VERSION}-$(Build.BuildId)"
              echo "Version package.json : ${VERSION}"
              echo "BuildId              : $(Build.BuildId)"
              echo "Commit SHA corto     : ${SHA}"
              echo "Tag principal        : ${IMAGE_TAG}"
              echo "##vso[task.setvariable variable=semver]${VERSION}"
              echo "##vso[task.setvariable variable=imageTag]${IMAGE_TAG}"
              echo "##vso[task.setvariable variable=shaShort]${SHA}"
            displayName: 'Calcular tags de imagen (semver + BuildId + SHA)'

          - bash: |
              set -euo pipefail
              echo ">>> Autenticando en Azure ACR: $(acrRegistry)"
              echo "$(acrPassword)" | docker login $(acrRegistry) -u $(acrUser) --password-stdin

              URI="$(acrRegistry)/$(imageName)"
              echo ">>> Construyendo imagen Docker para Azure (linux/amd64)..."
              docker build \
                --platform linux/amd64 \
                --build-arg BACKEND_URL="$(BACKEND_URL_PRODUCTION)" \
                -t "${URI}:$(imageTag)" \
                -t "${URI}:$(semver)" \
                -t "${URI}:$(shaShort)" \
                -t "${URI}:latest" \
                .

              echo ">>> Subiendo tags a Azure ACR..."
              for tag in "$(imageTag)" "$(semver)" "$(shaShort)" "latest"; do
                echo "Pushing: ${URI}:${tag}"
                docker push "${URI}:${tag}"
              done

              echo "${URI}:$(imageTag)" > deployimage.txt
              echo "✅ Imagen publicada exitosamente en Azure ACR"
            displayName: 'Docker Login, Build y Push a Azure ACR'

          - publish: deployimage.txt
            artifact: imageinfo
            displayName: 'Publicar artifact imageinfo'

  # ---------------------------------------------------------------------------
  # Stage 2: ImageScan (Trivy + SBOM CycloneDX)
  # ---------------------------------------------------------------------------
  - stage: ImageScan
    displayName: 'Image Scan (Trivy + SBOM)'
    dependsOn: BuildPush
    jobs:
      - job: ScanImage
        displayName: 'Trivy scan + SBOM'
        steps:
          - download: current
            artifact: imageinfo

          - bash: |
              set -euo pipefail
              SCAN_IMAGE=$(cat $(Pipeline.Workspace)/imageinfo/deployimage.txt)
              echo "Imagen a escanear: ${SCAN_IMAGE}"
              echo "##vso[task.setvariable variable=scanImage]${SCAN_IMAGE}"
            displayName: 'Leer URI de imagen del artifact'

          - bash: |
              set -euo pipefail
              echo "$(acrPassword)" | docker login $(acrRegistry) -u $(acrUser) --password-stdin
              docker pull "$(scanImage)"
            displayName: 'Pull de la imagen desde Azure ACR'

          - bash: |
              set -euo pipefail
              if ! command -v trivy >/dev/null 2>&1; then
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                  | sh -s -- -b /usr/local/bin
              fi
              echo ">>> Trivy scan sobre: $(scanImage)"

              # Reporte informativo de HIGH
              echo "--- Reporte HIGH (informativo) ---"
              trivy image --severity HIGH --ignore-unfixed --exit-code 0 $(scanImage) || true

              # Escaneo CRITICAL
              echo "--- Reporte CRITICAL ---"
              trivy image \
                --severity CRITICAL \
                --exit-code 0 \
                --ignore-unfixed \
                $(scanImage) || true
              echo "✅ Trivy image scan completado"
            displayName: 'Trivy image scan (CRITICAL & HIGH)'
            continueOnError: true

          - bash: |
              set -euo pipefail
              if ! command -v trivy >/dev/null 2>&1; then
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                  | sh -s -- -b /usr/local/bin
              fi
              echo ">>> Generando SBOM CycloneDX..."
              trivy image \
                --format cyclonedx \
                --output $(Build.ArtifactStagingDirectory)/sbom.cdx.json \
                --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
                $(scanImage)
              echo "✅ SBOM generado exitosamente"
            displayName: 'Generar SBOM CycloneDX'
            continueOnError: true

          - publish: $(Build.ArtifactStagingDirectory)/sbom.cdx.json
            artifact: sbom-cyclonedx
            displayName: 'Publicar artifact sbom-cyclonedx'
            condition: succeededOrFailed()

  # ---------------------------------------------------------------------------
  # Stage 3: Deploy a Azure Kubernetes Service (AKS)
  # ---------------------------------------------------------------------------
  - stage: DeployToAKS
    displayName: 'Despliegue en Azure AKS'
    dependsOn: ImageScan
    condition: succeededOrFailed()
    jobs:
      - job: Deploy
        displayName: 'kubectl apply en Azure AKS'
        steps:
          - checkout: self

          - download: imageinfo
            displayName: 'Descargar artefacto imageinfo'

          - bash: |
              set -euo pipefail
              echo ">>> Configurando credenciales de Kubernetes..."
              mkdir -p ~/.kube
              echo "" | base64 -d > ~/.kube/config
              DEPLOY_IMAGE=$(cat $(Pipeline.Workspace)/imageinfo/deployimage.txt)
              echo ">>> Aplicando manifiestos de Kubernetes en AKS..."
              kubectl apply -f k8s/

              echo ">>> Actualizando la imagen a ${DEPLOY_IMAGE}..."
              kubectl set image deployment/frontend frontend="${DEPLOY_IMAGE}" -n dimo3

              echo ">>> Verificando el estado del despliegue en AKS..."
              kubectl rollout status deployment/frontend -n dimo3 --timeout=180s

              echo "✅ Despliegue en Azure AKS completado con éxito"
            displayName: 'kubectl apply y rollout status en AKS'
