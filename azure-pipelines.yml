# ============================================================
# Pipeline CI/CD para Next.js (Standalone) -> Azure App Service
# Web App: "Dimo3" - Node 22 LTS - Linux
# ============================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main
      - develop

variables:
  - group: 'Frontend-Secrets'
  - name: azureSubscription
    value: 'Dimo-Azure-ServiceConnection'
  - name: webAppName
    value: 'Dimo3'
  - name: npm_config_cache
    value: $(Pipeline.Workspace)/.npm

stages:
  # ============================================================
  # STAGE 1: BUILD (CI)
  # ============================================================
  - stage: Build
    displayName: 'Build and Package'
    jobs:
      - job: BuildJob
        displayName: 'Node.js Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Cache@2
            displayName: 'Cache npm packages'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)

          - task: UseNode@1
            displayName: 'Use Node.js 22.x'
            inputs:
              version: '22.x'

          - script: npm ci --prefer-offline --no-audit
            displayName: 'Install dependencies'

          - script: npm run lint
            displayName: 'Run Linter'

          - script: npm run build
            displayName: 'Build Next.js Application'
            env:
              BACKEND_URL: $(BACKEND_URL)

          - script: |
              set -euo pipefail

              DEPLOY_DIR="$(System.DefaultWorkingDirectory)/standalone_deploy"
              STANDALONE_DIR="$(System.DefaultWorkingDirectory)/.next/standalone"

              if [ ! -d "$STANDALONE_DIR" ]; then
                echo "##vso[task.logissue type=error]No se encontro .next/standalone"
                exit 1
              fi

              mkdir -p "$DEPLOY_DIR"
              cp -rL "$STANDALONE_DIR/." "$DEPLOY_DIR/"
              cp -rL "$(System.DefaultWorkingDirectory)/public" "$DEPLOY_DIR/public"
              cp -rL "$(System.DefaultWorkingDirectory)/.next/static" "$DEPLOY_DIR/.next/static"

              # Cambiar script start de package.json para ejecucion en App Service
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('$DEPLOY_DIR/package.json', 'utf8'));
                pkg.scripts = { start: 'node server.js' };
                fs.writeFileSync('$DEPLOY_DIR/package.json', JSON.stringify(pkg, null, 2));
                console.log('package.json actualizado: start -> node server.js');
              "

              # Limpieza de archivos redundantes
              rm -f "$DEPLOY_DIR/oryx-manifest.toml" 2>/dev/null || true
              rm -f "$DEPLOY_DIR/node_modules.tar.gz" 2>/dev/null || true

              echo "=== Contenido de standalone_deploy ==="
              ls -la "$DEPLOY_DIR"
              echo ""
              echo "=== package.json final ==="
              cat "$DEPLOY_DIR/package.json"
              echo ""
              echo "=== Tamano total ==="
              du -sh "$DEPLOY_DIR"
            displayName: 'Prepare Standalone Artifacts'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          - task: ArchiveFiles@2
            displayName: 'Create ZIP archive'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/standalone_deploy'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/frontend-drop.zip'
              replaceExistingArchive: true

          - script: |
              echo "=== Tamano del ZIP ==="
              ls -lh "$(Build.ArtifactStagingDirectory)/frontend-drop.zip"
              echo ""
              echo "=== Validacion del contenido del ZIP ==="
              zipinfo -1 "$(Build.ArtifactStagingDirectory)/frontend-drop.zip" | grep -E "^server\.js$" \
                && echo "Confirmado: server.js en raiz" \
                || echo "Error: server.js NO se encuentra en la raiz"
            displayName: 'Verify ZIP Archive'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/frontend-drop.zip'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # ============================================================
  # STAGE 2: DEPLOY (CD)
  # ============================================================
  - stage: Deploy
    displayName: 'Deploy to App Service'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Dimo3 WebApp'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'dimo-frontend-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy ZIP Archive'
                  continueOnError: true
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/frontend-drop.zip'
                    deploymentMethod: 'zipDeploy'

                - script: |
                    echo "Esperando 30s para arranque de servicios..."
                    sleep 30

                    APP_URL="https://dimo3-h6f9adhqgrcbeehh.eastus-01.azurewebsites.net"
                    echo "Verificando respuesta en: $APP_URL"
                    HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" --max-time 30 || echo "000")

                    if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
                      echo "Verificacion de disponibilidad correcta (HTTP $HTTP_STATUS)"
                    else
                      echo "Fallo de respuesta (HTTP $HTTP_STATUS). Verificar logs de ejecucion en el portal de Azure."
                      exit 1
                    fi
                  displayName: 'Application Health Check'
